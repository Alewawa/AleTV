name: Update IPTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
  push:
    branches:
      - main
    paths:
      - "generate_playlist.py"
      - ".github/workflows/update-playlist.yml"

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate playlist
        run: python generate_playlist.py

      - name: Check Smarters-compatible TV Peru
        shell: bash
        run: |
          echo "=== TV Peru ==="
          grep -F -A2 ",TV Peru" playlist.m3u | head -n 3 || true
          echo
          echo "=== TV Peru Noticias ==="
          grep -F -A2 ",TV Peru Noticias" playlist.m3u | head -n 3 || true
          echo
          if grep -F -A2 ",TV Peru" playlist.m3u | grep -q "190.93.224.42/TV-PERU/index.m3u8"; then
            echo "OK: TV Peru usa la fuente compatible con Smarters."
          else
            echo "ERROR: TV Peru no usa la fuente esperada."
            exit 1
          fi

      - name: Commit updated playlist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          if git diff --cached --quiet; then
            echo "playlist.m3u no cambio."
          else
            git commit -m "Update IPTV playlist for Smarters"
            git push
          fi
