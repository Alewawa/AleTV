name: Actualizar playlist IPTV

on:
  workflow_dispatch:
  push:
    paths:
      - 'generate_playlist.py'
      - '.github/workflows/update-playlist.yml'
  schedule:
    # 07:17 UTC = 02:17 en Peru (America/Lima).
    # Se evita el minuto 00 porque los workflows programados pueden retrasarse
    # cuando hay mucha carga al inicio de la hora.
    - cron: '17 7 * * *'

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generar playlist
        run: python generate_playlist.py

      - name: Guardar cambios
        shell: bash
        run: |
          if git diff --quiet -- playlist.m3u; then
            echo "La playlist no cambio."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git commit -m "Actualizar playlist IPTV"
          git push
