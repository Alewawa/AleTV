name: Update IPTV Playlist
on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
  push:
    branches: [main]
    paths:
      - "generate_playlist.py"
      - ".github/workflows/update-playlist.yml"
permissions:
  contents: write
jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare audio inspection
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffprobe -version | head -n 1
      - name: Generate playlist and source-selection report
        run: python generate_playlist.py
      - name: Upload selection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AleTV-Fuentes-elegidas
          path: source_selection_report.csv
          if-no-files-found: warn
          retention-days: 30
      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --cached --quiet || git commit -m "Update IPTV playlist"
          git push
