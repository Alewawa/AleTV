name: Build AleTV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          sdkmanager --version
          sdkmanager --list_installed | head -n 80

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Verify Gradle
        shell: bash
        run: |
          which gradle
          gradle --version

      - name: Build AleTV APK
        working-directory: android-app
        shell: bash
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk apk/AleTV-v1.apk
          ls -lh apk/AleTV-v1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AleTV-v1-FireTV
          path: apk/AleTV-v1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK in repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/AleTV-v1.apk

          if git diff --cached --quiet; then
            echo "APK unchanged."
          else
            git commit -m "Build AleTV v1 APK"
            git push
          fi
