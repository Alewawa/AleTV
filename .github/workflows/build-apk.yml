name: Build AleTV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Verify toolchain
        shell: bash
        run: |
          java -version
          gradle --version
          sdkmanager --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build AleTV APK
        id: gradle_build
        working-directory: android-app
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AleTV-gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          mkdir -p apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk apk/AleTV-v1.apk
          ls -lh apk/AleTV-v1.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AleTV-v1-FireTV
          path: apk/AleTV-v1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK in repository
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/AleTV-v1.apk
          if git diff --cached --quiet; then
            echo "APK unchanged."
          else
            git commit -m "Build AleTV v1 APK"
            git push
          fi
